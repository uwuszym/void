<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Void — Login</title>
  <style>
    :root{
      --red:#e2231a;
      --dark:#191919;
      --text:#393939;
      --border:#c9c9c9;
      --bg:#f2f2f2;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f2f2f2}
    body{min-height:100vh}
    .topbar{
      height:56px;background:#191919;color:#fff;border-bottom:1px solid #111;
      display:flex;align-items:center;padding:0 28px;gap:28px;
      box-shadow:0 1px 3px rgba(0,0,0,.25)
    }
    .brand{font-size:27px;font-weight:800;letter-spacing:-1.5px;color:#fff;text-decoration:none}
    .brand span{font-weight:400}
    .nav{display:flex;gap:4px;height:100%;align-items:center}
    .nav a{color:#ddd;text-decoration:none;padding:19px 15px 17px;font-size:14px}
    .nav a:hover{background:#292929;color:#fff}
    .nav-spacer{flex:1}
    .signup-top{font-size:13px;color:#ddd}
    .signup-top a{color:#fff;text-decoration:none;font-weight:700}
    .hero{
      min-height:calc(100vh - 56px);
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
      background:
        linear-gradient(rgba(255,255,255,.93),rgba(238,238,238,.96)),
        radial-gradient(circle at 15% 20%,#fff 0,#ddd 45%,#bbb 100%);
    }
    .hero:before,.hero:after{
      content:"";position:absolute;border:1px solid rgba(0,0,0,.06);
      transform:rotate(18deg);width:480px;height:480px;border-radius:8px;
    }
    .hero:before{left:-250px;top:10%;box-shadow:420px 180px 0 rgba(0,0,0,.025)}
    .hero:after{right:-270px;bottom:-180px;transform:rotate(-15deg)}
    .login-wrap{width:100%;max-width:420px;padding:30px 18px;position:relative;z-index:1}
    .logo{
      text-align:center;font-size:42px;line-height:1;font-weight:900;
      letter-spacing:-3px;color:#222;margin-bottom:24px;
    }
    .logo small{display:block;font-size:11px;letter-spacing:2px;font-weight:700;color:#888;margin-top:9px}
    .panel{
      background:#fff;border:1px solid #d0d0d0;border-radius:3px;
      box-shadow:0 2px 8px rgba(0,0,0,.13);padding:26px 30px 28px;
    }
    h1{text-align:center;font-size:24px;font-weight:400;margin:0 0 22px;color:#222}
    label{display:block;font-size:12px;font-weight:700;margin:0 0 7px;color:#555}
    input{
      width:100%;height:42px;border:1px solid var(--border);border-radius:2px;
      padding:0 12px;font-size:14px;background:#fff;outline:none;margin-bottom:15px;
    }
    input:focus{border-color:#888;box-shadow:0 0 0 2px rgba(34,34,34,.08)}
    button{
      width:100%;height:42px;border:1px solid #b71913;border-radius:3px;
      background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
      box-shadow:inset 0 1px rgba(255,255,255,.2)
    }
    button:hover{background:#c91e16}
    .forgot{display:block;text-align:center;margin:15px 0 21px;color:#555;font-size:12px;text-decoration:none}
    .forgot:hover{text-decoration:underline}
    .divider{height:1px;background:#e5e5e5;margin:0 -2px 19px}
    .new{text-align:center;font-size:13px;color:#777;margin:0}
    .new a{color:#333;font-weight:700;text-decoration:none}
    .new a:hover{text-decoration:underline}
    .notice{display:none;margin:0 0 16px;padding:9px 11px;border:1px solid #e5c2c2;background:#fff5f5;color:#9b1c1c;font-size:12px;border-radius:2px}
    footer{text-align:center;color:#999;font-size:11px;margin-top:18px}
    @media(max-width:600px){
      .topbar{padding:0 15px;gap:12px}.nav{display:none}.signup-top{font-size:12px}
      .login-wrap{padding:20px 12px}.panel{padding:24px 20px}.logo{font-size:36px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">VOID<span>.</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/">Play</a>
      <a href="#about">About</a>
      <a href="#platforms">Platforms</a>
    </nav>
    <div class="nav-spacer"></div>
    <div class="signup-top">New here? <a href="#signup">Sign Up</a></div>
  </header>

  <main class="hero">
    <div class="login-wrap">
      <div class="logo">VOID<small>IMAGINE • CREATE • PLAY</small></div>
      <section class="panel" aria-labelledby="login-title">
        <h1 id="login-title">Log In</h1>
        <div id="notice" class="notice" role="alert">Login backend is not connected yet.</div>
        <form id="loginForm">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button type="submit">Log In</button>
        </form>
        <a class="forgot" href="#forgot">Forgot Username/Password?</a>
        <div class="divider"></div>
        <p class="new">Don't have an account? <a href="#signup">Sign Up</a></p>
      </section>
      <footer>© 2026 Void Revival</footer>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('notice').style.display = 'block';
    });
  </script>
</body>
</html>
