<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Void Revival</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: #4e54c8; color: #fff; }
    .area {
      min-height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to left, #8f94fb, #4e54c8);
    }
    .card {
      position: relative;
      z-index: 2;
      background: rgba(0,0,0,.5);
      border: 0;
      color: #fff;
      max-width: 560px;
      text-align: center;
    }
    .circles { position: absolute; inset: 0; overflow: hidden; margin: 0; padding: 0; }
    .circles li {
      position: absolute;
      display: block;
      list-style: none;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,.2);
      animation: animate 25s linear infinite;
      bottom: -150px;
    }
    .circles li:nth-child(1){left:25%;width:80px;height:80px}
    .circles li:nth-child(2){left:10%;animation-delay:2s;animation-duration:12s}
    .circles li:nth-child(3){left:70%;animation-delay:4s}
    .circles li:nth-child(4){left:40%;width:60px;height:60px;animation-duration:18s}
    .circles li:nth-child(5){left:65%}
    .circles li:nth-child(6){left:75%;width:110px;height:110px;animation-delay:3s}
    .circles li:nth-child(7){left:35%;width:150px;height:150px;animation-delay:7s}
    .circles li:nth-child(8){left:50%;width:25px;height:25px;animation-delay:15s;animation-duration:45s}
    .circles li:nth-child(9){left:20%;width:15px;height:15px;animation-delay:2s;animation-duration:35s}
    .circles li:nth-child(10){left:85%;width:150px;height:150px;animation-duration:11s}
    @keyframes animate {
      0% { transform: translateY(0) rotate(0); opacity: 1; border-radius: 0; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
    }
  </style>
</head>
<body>
  <main class="area">
    <ul class="circles" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <section class="card p-4 shadow">
      <h1 class="mb-3">Void Revival</h1>
      <p class="mb-4">The Void Roblox revival web interface is online.</p>
      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a class="btn btn-light" href="https://discord.gg/UEuXjD565c">Discord</a>
        <a class="btn btn-dark" href="https://github.com/uwuszym/void">GitHub</a>
      </div>
    </section>
  </main>
</body>
</html>
